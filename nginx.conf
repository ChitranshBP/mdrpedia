# MDRPedia Nginx Configuration
# Place this file at: /etc/nginx/sites-available/mdrpedia
# Then: sudo ln -s /etc/nginx/sites-available/mdrpedia /etc/nginx/sites-enabled/mdrpedia
#
# NOTE: a wildcard 302 to /404 is currently being served from host-panel config
# that is NOT in this repo. It must be removed there, or the rules below are
# shadowed. See tasks/todo.md P1.1.

# Shared cache for SSR pages. Sized for the ~1,150 profile pages plus hubs.
proxy_cache_path /var/cache/nginx/mdrpedia
    levels=1:2
    keys_zone=mdrpedia_cache:20m
    max_size=1g
    inactive=24h
    use_temp_path=off;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mdrpedia.com www.mdrpedia.com;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://mdrpedia.com$request_uri;
    }
}

# Canonical host: www -> apex.
# Previously `www.` served the entire site with no redirect, duplicating the
# whole corpus across two hostnames.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mdrpedia.com;

    # ssl_certificate /etc/letsencrypt/live/mdrpedia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mdrpedia.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mdrpedia.com$request_uri;
}

# HTTPS — SSL will be filled in by Certbot
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mdrpedia.com;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/mdrpedia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mdrpedia.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase upload/request limits
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Legacy URLs from the previous agency site on this domain ────────────
    # 2,358 distinct URLs under these prefixes are still being crawled. The
    # content is gone, not moved: 410 is the honest signal and stops Google
    # retrying, where a mass 301 to an unrelated page is treated as a soft-404.
    # Genuine one-to-one mappings belong in astro.config.mjs `redirects`.
    location ^~ /services/ {
        return 410;
    }
    location ^~ /industries/ {
        return 410;
    }

    # ── Cached profile and hub pages ───────────────────────────────────────
    # These are the pages crawlers hammer. Without a shared cache every hit
    # re-executes the full Prisma include tree, since Cache-Control alone has
    # nothing honouring it.
    location ~ ^/(doctors|specialty|geography|institutions|rankings)(/|$) {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        proxy_cache mdrpedia_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 301 10m;
        proxy_cache_valid 404 1m;
        # Serve the stale copy while one request refreshes it, and keep serving
        # it if the app is erroring — better than passing a 500 to a crawler.
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Proxy to Node.js app
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Never index API or admin surfaces.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Cache static Astro hashed assets forever
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
