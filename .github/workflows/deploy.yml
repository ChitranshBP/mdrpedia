name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/mdrpedia.com/public_html
            git pull origin main
            npm ci
            npx prisma generate
            # `prisma generate` can exit 0 after failing to load prisma.config.ts
            # (e.g. a missing DIRECT_DATABASE_URL), leaving an unusable client and
            # a build that 500s on every DB-backed route. Fail here instead.
            node -e "import('@prisma/client').then(m => { if (!m.PrismaClient) { console.error('Prisma client did not generate'); process.exit(1); } }).catch(e => { console.error(e.message); process.exit(1); })"
            npm run build
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save
            # Confirm the app actually serves before calling the deploy green.
            for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break || sleep 2; done
            curl -sf -o /dev/null http://127.0.0.1:4321/ || { echo 'Site not responding after deploy'; pm2 logs mdrpedia --lines 30 --nostream; exit 1; }
